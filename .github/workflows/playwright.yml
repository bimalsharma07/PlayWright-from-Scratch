name: Playwright Test Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - master

jobs:
  # -----------------------------
  # SMOKE TESTS (Runs on PR)
  # -----------------------------
  smoke:
    if: github.event_name == 'pull_request'
    name: 🧪 Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Smoke Tests
        env:
          BASE_URL: "https://www.saucedemo.com/"
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: npx playwright test --grep "@smoke"

      - name: Install Allure Commandline
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        run: npx allure-commandline generate ./allure-results --clean -o ./allure-report

      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-report
          path: ./allure-report
          retention-days: 30

  # -----------------------------
  # REGRESSION TESTS (After Merge)
  # -----------------------------
  regression:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: 🔁 Regression Tests (Post-Merge)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Regression Tests
        env:
          BASE_URL: "https://www.saucedemo.com/"
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: npx playwright test --grep "@regression"

      - name: Install Allure Commandline
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        run: npx allure-commandline generate ./allure-results --clean -o ./allure-report

      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: regression-allure-report
          path: ./allure-report
          retention-days: 30
